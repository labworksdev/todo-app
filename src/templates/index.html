<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>
<body>
    <div class="container">
        <header class="page-header" style="display: flex; align-items: flex-start; justify-content: space-between;">
            <div>
                <h1>Todo App</h1>
                <p>Keep track of what needs to get done.</p>
            </div>
            <form action="/logout" method="POST" style="display:inline;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button class="btn btn-secondary btn-sm" type="submit">Sign out</button>
            </form>
        </header>

        <div class="card">
            <form action="/add" method="POST" class="add-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input class="input" type="text" name="title" placeholder="Add a new todo…" autocomplete="off">
                <button class="btn btn-primary" type="submit">Add</button>
            </form>
        </div>

        <div class="card">
            {% if todos %}
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Task</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for todo in todos %}
                    <tr>
                        <td style="color: var(--color-text-muted); font-size: var(--font-size-sm);">{{ todo.id }}</td>
                        <td>{{ todo.title }}</td>
                        <td>
                            {% if todo.completed %}
                            <span class="badge badge-success">Done</span>
                            {% else %}
                            <span class="badge badge-open">Open</span>
                            {% endif %}
                        </td>
                        <td>
                            <div class="actions">
                                <form action="/toggle/{{ todo.id }}" method="POST" style="display:inline;">
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                    <button class="btn btn-secondary btn-sm" type="submit">
                                        {% if todo.completed %}Reopen{% else %}Complete{% endif %}
                                    </button>
                                </form>
                                <form action="/delete/{{ todo.id }}" method="POST" style="display:inline;">
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                    <button class="btn btn-danger btn-sm" type="submit">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            {% else %}
            <p class="empty-state">No todos yet — add one above.</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
