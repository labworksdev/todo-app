---
name: Deploy

permissions:
  contents: read

on:
  push:
    branches: [main]

env:
  python_version: "3.13"

defaults:
  run:
    shell: 'bash --noprofile --norc -Eeuo pipefail {0}'

jobs:
  deploy:
    name: Build & Deploy to Azure
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: 'false'
      - name: Bootstrap repository
        uses: ./.github/actions/bootstrap
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          python-version: ${{ env.python_version }}
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Log in to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login labworksacr.azurecr.io \
            --username "${{ secrets.ACR_USERNAME }}" \
            --password-stdin
      - name: Build image
        run: task -v build
      - name: Verify image exists
        run: docker image inspect labworksdev/todo-app:latest > /dev/null
      - name: Tag and push to ACR
        run: |
          docker tag labworksdev/todo-app:latest labworksacr.azurecr.io/todo-app:${{ github.sha }}
          docker tag labworksdev/todo-app:latest labworksacr.azurecr.io/todo-app:latest
          docker push labworksacr.azurecr.io/todo-app:${{ github.sha }}
          docker push labworksacr.azurecr.io/todo-app:latest
      - name: Verify image in ACR
        run: az acr repository show-tags --name labworksacr --repository todo-app --filter "${{ github.sha }}" --output tsv | grep -q "${{ github.sha }}"
      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name todo-app \
            --resource-group rg-todo-app \
            --image labworksacr.azurecr.io/todo-app:${{ github.sha }}
